spring:
  application:
    name: sync-batch-data

  datasource:
    url: jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,loggers,batch
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# External datasource routing (add more as needed)
# To add MSSQL: driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
# To add Oracle: driver-class-name: oracle.jdbc.OracleDriver
# To add DB2:    driver-class-name: com.ibm.db2.jcc.DB2Driver
datasources:
  external:
    source1:
      url: jdbc:h2:mem:source1db;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
    source2:
      url: jdbc:h2:mem:source2db;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password: ""
      driver-class-name: org.h2.Driver

# Resilience4j configuration
resilience4j:
  circuitbreaker:
    instances:
      externalClient:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      externalClient:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.dao.TransientDataAccessException

# Batch sync scheduler
batch:
  sync:
    cron: "0 0 */2 * * ?"
    enabled: true
    chunk-size: 100
    skip-limit: 10
    retry-limit: 3
